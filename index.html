<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeanImporter</title>
  <script src="/static/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; background: #fafafa; }
    h1 { margin-bottom: .5rem; font-size: 1.75rem; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 .75rem; color: #92400e; border-bottom: 2px solid #f59e0b; padding-bottom: .25rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; font-size: .9rem; }

    .url-row { display: flex; gap: .5rem; margin-bottom: 1rem; }
    .url-row input { flex: 1; padding: .6rem .75rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 6px; }
    .url-row input:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.2); }

    button { padding: .6rem 1.25rem; font-size: .95rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background .15s; }
    .btn-primary { background: #f59e0b; color: #fff; }
    .btn-primary:hover { background: #d97706; }
    .btn-primary:disabled { background: #fcd34d; cursor: not-allowed; }
    .btn-fill { background: #16a34a; color: #fff; }
    .btn-fill:hover { background: #15803d; }
    .btn-fill:disabled { background: #86efac; cursor: not-allowed; }
    .btn-sm { padding: .35rem .75rem; font-size: .85rem; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-add { background: #e5e7eb; color: #374151; }
    .btn-add:hover { background: #d1d5db; }

    #error { color: #dc2626; margin-bottom: 1rem; padding: .5rem .75rem; background: #fef2f2; border-radius: 6px; display: none; }
    #status { margin-bottom: 1rem; color: #92400e; font-weight: 500; }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #fcd34d; border-top-color: #f59e0b; border-radius: 50%; animation: spin .6s linear infinite; margin-right: .5rem; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #formArea { display: none; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .grid { display: grid; gap: .75rem; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    label { display: block; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin-bottom: .25rem; }
    input, select, textarea { width: 100%; padding: .5rem .6rem; font-size: .9rem; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.2); }
    textarea { resize: vertical; min-height: 4rem; }
    select { background: #fff; }

    .checkbox-row { display: flex; align-items: center; gap: .5rem; margin-top: .5rem; }
    .checkbox-row input[type="checkbox"] { width: auto; }

    .variety-card { background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: .75rem 1rem; margin-bottom: .5rem; position: relative; }
    .variety-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
    .variety-header span { font-weight: 600; font-size: .85rem; color: #92400e; }

    .actions { display: flex; gap: .75rem; margin-top: 1.5rem; }
    .actions button { flex: 1; padding: .75rem; font-size: 1rem; }

    @media (max-width: 600px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <h1>BeanImporter</h1>
  <p class="subtitle">Kaffeebohnen-Daten extrahieren und in Beanconqueror importieren</p>

  <div class="url-row">
    <input type="url" id="url" placeholder="Produkt-URL eingeben…">
    <button class="btn-primary" id="extractBtn" onclick="doExtract()">Extrahieren</button>
  </div>

  <div id="error"></div>
  <div id="status"></div>

  <div id="formArea">
    <h2>Allgemein</h2>
    <div class="card">
      <div class="grid grid-2">
        <div><label>Coffee Name *</label><input id="f_coffee_name"></div>
        <div><label>Roaster</label><input id="f_roaster"></div>
        <div><label>Roasting Date</label><input type="date" id="f_roasting_date"></div>
        <div><label>Website</label><input type="url" id="f_website"></div>
      </div>
    </div>

    <h2>Röstung</h2>
    <div class="card">
      <div class="grid grid-3">
        <div>
          <label>Roast Profile</label>
          <select id="f_bean_roasting_type">
            <option value="">–</option>
            <option value="FILTER">Filter</option>
            <option value="ESPRESSO">Espresso</option>
            <option value="OMNI">Omni</option>
          </select>
        </div>
        <div>
          <label>Roast Level</label>
          <select id="f_roast">
            <option value="">–</option>
            <option value="CINNAMON_ROAST">Cinnamon (Light)</option>
            <option value="AMERICAN_ROAST">American (Light)</option>
            <option value="NEW_ENGLAND_ROAST">New England (Light)</option>
            <option value="HALF_CITY_ROAST">Half City (Light)</option>
            <option value="MODERATE_LIGHT_ROAST">Moderate Light</option>
            <option value="CITY_ROAST">City (Medium)</option>
            <option value="CITY_PLUS_ROAST">City+ (Medium)</option>
            <option value="FULL_CITY_ROAST">Full City (Medium)</option>
            <option value="FULL_CITY_PLUS_ROAST">Full City+ (Dark)</option>
            <option value="ITALIAN_ROAST">Italian (Dark)</option>
            <option value="VIEANNA_ROAST">Vienna (Dark)</option>
            <option value="FRENCH_ROAST">French (Dark)</option>
            <option value="CUSTOM_ROAST">Custom…</option>
          </select>
        </div>
        <div><label>Custom Roast</label><input id="f_roast_custom" placeholder="Nur bei Custom"></div>
        <div><label>Roast Range (0–5)</label><input type="number" id="f_degree_of_roast" min="0" max="5" step="0.1"></div>
        <div>
          <label>Type</label>
          <select id="f_bean_mix">
            <option value="">–</option>
            <option value="SINGLE_ORIGIN">Single Origin</option>
            <option value="BLEND">Blend</option>
          </select>
        </div>
      </div>
    </div>

    <h2>Details</h2>
    <div class="card">
      <div class="grid grid-3">
        <div><label>Weight (g)</label><input type="number" id="f_weight"></div>
        <div><label>Cost (€)</label><input type="number" id="f_cost" step="0.01"></div>
        <div><label>EAN Article</label><input id="f_ean_article"></div>
      </div>
      <div class="grid grid-2" style="margin-top:.75rem">
        <div><label>Flavour Profile</label><input id="f_flavour_profile"></div>
        <div><label>Cupping Points</label><input id="f_cupping_points"></div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="f_decaffeinated"><label for="f_decaffeinated" style="margin:0;text-transform:none;font-size:.9rem">Decaffeinated</label>
      </div>
    </div>

    <h2>Varietäten <button class="btn-sm btn-add" onclick="addVariety()">+ Hinzufügen</button></h2>
    <div id="varietiesContainer"></div>

    <h2>Notes</h2>
    <div class="card">
      <textarea id="f_notes" rows="4"></textarea>
    </div>

    <div class="actions">
      <button class="btn-fill" id="fillBtn" onclick="doFill()">In Beanconqueror eintragen</button>
    </div>
  </div>

  <div id="qrArea" style="display:none;text-align:center;margin-top:1.5rem;padding:1.5rem;background:#fff;border:1px solid #e5e7eb;border-radius:8px">
    <h2 style="border:none;color:#1a1a1a;margin:0 0 .75rem">Import-QR für dein Handy</h2>
    <p style="color:#6b7280;font-size:.85rem;margin-bottom:1rem">Mit der Kamera scannen — Beanconqueror-App öffnet sich automatisch.</p>
    <div id="qrcode" style="display:inline-block"></div>
  </div>

  <script>
    let beanData = null;

    async function doExtract() {
      const url = document.getElementById('url').value.trim();
      if (!url) return;

      const btn = document.getElementById('extractBtn');
      const status = document.getElementById('status');
      const error = document.getElementById('error');

      btn.disabled = true;
      status.innerHTML = '<span class="spinner"></span>Extrahiere Daten… (kann 30–60s dauern)';
      error.style.display = 'none';
      document.getElementById('formArea').style.display = 'none';

      try {
        const res = await fetch('/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`HTTP ${res.status}: ${body}`);
        }
        beanData = await res.json();
        populateForm(beanData);
        document.getElementById('formArea').style.display = 'block';
        status.textContent = '';
      } catch (e) {
        error.textContent = 'Fehler: ' + e.message;
        error.style.display = 'block';
        status.textContent = '';
      } finally {
        btn.disabled = false;
      }
    }

    function populateForm(d) {
      val('f_coffee_name', d.coffee_name);
      val('f_roaster', d.roaster);
      val('f_roasting_date', d.roasting_date);
      val('f_website', d.website);
      val('f_bean_roasting_type', d.bean_roasting_type);
      val('f_roast', d.roast);
      val('f_roast_custom', d.roast_custom);
      val('f_degree_of_roast', d.degree_of_roast);
      val('f_bean_mix', d.bean_mix);
      val('f_weight', d.weight);
      val('f_cost', d.cost);
      val('f_ean_article', d.ean_article);
      val('f_flavour_profile', d.flavour_profile);
      val('f_cupping_points', d.cupping_points);
      document.getElementById('f_decaffeinated').checked = d.decaffeinated || false;
      val('f_notes', d.notes);

      const container = document.getElementById('varietiesContainer');
      container.innerHTML = '';
      if (d.varieties && d.varieties.length) {
        d.varieties.forEach(v => addVariety(v));
      } else {
        addVariety();
      }
    }

    function val(id, v) {
      const el = document.getElementById(id);
      if (el) el.value = (v !== null && v !== undefined) ? v : '';
    }

    function addVariety(data) {
      const container = document.getElementById('varietiesContainer');
      const idx = container.children.length;
      const d = data || {};
      const card = document.createElement('div');
      card.className = 'variety-card';
      card.innerHTML = `
        <div class="variety-header">
          <span>Varietät ${idx + 1}</span>
          <button class="btn-sm btn-danger" onclick="this.closest('.variety-card').remove();reindexVarieties()">Entfernen</button>
        </div>
        <div class="grid grid-4">
          <div><label>Country</label><input class="v_country" value="${esc(d.country)}"></div>
          <div><label>Region</label><input class="v_region" value="${esc(d.region)}"></div>
          <div><label>Farm</label><input class="v_farm" value="${esc(d.farm)}"></div>
          <div><label>Farmer</label><input class="v_farmer" value="${esc(d.farmer)}"></div>
          <div><label>Variety</label><input class="v_variety" value="${esc(d.variety)}"></div>
          <div><label>Processing</label><input class="v_processing" value="${esc(d.processing)}"></div>
          <div><label>Elevation</label><input class="v_elevation" value="${esc(d.elevation)}"></div>
          <div><label>Harvest Time</label><input class="v_harvest_time" value="${esc(d.harvest_time)}"></div>
          <div><label>Certification</label><input class="v_certification" value="${esc(d.certification)}"></div>
          <div><label>Percentage (%)</label><input type="number" class="v_percentage" value="${esc(d.percentage)}"></div>
        </div>`;
      container.appendChild(card);
    }

    function reindexVarieties() {
      document.querySelectorAll('.variety-card').forEach((card, i) => {
        card.querySelector('.variety-header span').textContent = `Varietät ${i + 1}`;
      });
    }

    function esc(v) {
      if (v === null || v === undefined) return '';
      return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    }

    function collectFormData() {
      const varieties = [];
      document.querySelectorAll('.variety-card').forEach(card => {
        varieties.push({
          country: card.querySelector('.v_country').value || null,
          region: card.querySelector('.v_region').value || null,
          farm: card.querySelector('.v_farm').value || null,
          farmer: card.querySelector('.v_farmer').value || null,
          variety: card.querySelector('.v_variety').value || null,
          processing: card.querySelector('.v_processing').value || null,
          elevation: card.querySelector('.v_elevation').value || null,
          harvest_time: card.querySelector('.v_harvest_time').value || null,
          certification: card.querySelector('.v_certification').value || null,
          percentage: card.querySelector('.v_percentage').value ? parseInt(card.querySelector('.v_percentage').value) : null,
        });
      });

      return {
        coffee_name: document.getElementById('f_coffee_name').value,
        roaster: document.getElementById('f_roaster').value || null,
        roasting_date: document.getElementById('f_roasting_date').value || null,
        website: document.getElementById('f_website').value || null,
        bean_roasting_type: document.getElementById('f_bean_roasting_type').value || null,
        roast: document.getElementById('f_roast').value || null,
        roast_custom: document.getElementById('f_roast_custom').value || null,
        degree_of_roast: document.getElementById('f_degree_of_roast').value ? parseFloat(document.getElementById('f_degree_of_roast').value) : null,
        bean_mix: document.getElementById('f_bean_mix').value || null,
        weight: document.getElementById('f_weight').value ? parseInt(document.getElementById('f_weight').value) : null,
        cost: document.getElementById('f_cost').value ? parseFloat(document.getElementById('f_cost').value) : null,
        ean_article: document.getElementById('f_ean_article').value || null,
        flavour_profile: document.getElementById('f_flavour_profile').value || null,
        cupping_points: document.getElementById('f_cupping_points').value || null,
        decaffeinated: document.getElementById('f_decaffeinated').checked,
        varieties: varieties,
        notes: document.getElementById('f_notes').value || null,
      };
    }

    function renderQr(link) {
      const area = document.getElementById('qrArea');
      const target = document.getElementById('qrcode');
      target.innerHTML = '';
      try {
        new QRCode(target, {
          text: link,
          width: 600,
          height: 600,
          correctLevel: QRCode.CorrectLevel.L,
        });
        area.style.display = 'block';
        area.scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        console.error('QR render failed:', e);
        area.style.display = 'none';
      }
    }

    async function doFill() {
      const data = collectFormData();
      if (!data.coffee_name) { alert('Coffee Name ist Pflichtfeld.'); return; }

      const btn = document.getElementById('fillBtn');
      const status = document.getElementById('status');
      const error = document.getElementById('error');

      btn.disabled = true;
      status.innerHTML = '<span class="spinner"></span>Öffne Beanconqueror und fülle Formular…';
      error.style.display = 'none';

      try {
        const res = await fetch('/fill', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`HTTP ${res.status}: ${body}`);
        }
        const result = await res.json();
        if (result.link) {
          status.innerHTML = 'Import-Link generiert: <a href="' + esc(result.link) + '" target="_blank" style="color:#2563eb;word-break:break-all">' + esc(result.link).substring(0, 80) + '…</a>';
          renderQr(result.link);
        } else {
          status.textContent = 'Beanconqueror-Formular wurde im Browser ausgefüllt.';
        }
      } catch (e) {
        error.textContent = 'Fehler: ' + e.message;
        error.style.display = 'block';
        status.textContent = '';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
